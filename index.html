<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayEase - Complete Hostel Management System</title>
  
  <!-- Material Symbols & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN with Container Queries & Forms -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            surface: '#0b1326',
            'surface-dim': '#0b1326',
            'surface-bright': '#31394d',
            'surface-container-lowest': '#060e20',
            'surface-container-low': '#131b2e',
            'surface-container': '#171f33',
            'surface-container-high': '#222a3d',
            'surface-container-highest': '#2d3449',
            'on-surface': '#dae2fd',
            'on-surface-variant': '#c7c4d7',
            'outline': '#908fa0',
            'outline-variant': '#464554',
            primary: '#c0c1ff',
            'primary-container': '#8083ff',
            'on-primary-container': '#0d0096',
            secondary: '#4edea3',
            'secondary-container': '#00a572',
            tertiary: '#ffb95f',
            error: '#ffb4ab',
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#0b1326',
            },
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React 18 UMD & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0b1326;
      color: #dae2fd;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Stitch Design System Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(11, 19, 38, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.35);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }

    /* Stitch Glassmorphic Elevation & Surfaces */
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }
    .dark .glass-card {
      background: rgba(23, 31, 51, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-hover {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1), 0 8px 24px -4px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    /* Stitch Status Glows */
    .status-glow-success { box-shadow: 0 0 14px -2px rgba(78, 222, 163, 0.5); }
    .status-glow-warning { box-shadow: 0 0 14px -2px rgba(255, 185, 95, 0.5); }
    .status-glow-error { box-shadow: 0 0 14px -2px rgba(255, 180, 171, 0.5); }
    .status-glow-primary { box-shadow: 0 0 14px -2px rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body class="bg-surface text-on-surface font-sans transition-colors duration-300 min-h-screen selection:bg-brand-500 selection:text-white">

  <!-- Stitch System Central Operations Launch Bar -->
  <div class="bg-gradient-to-r from-brand-950 via-slate-900 to-indigo-950 border-b border-brand-500/30 px-4 py-2 text-xs flex flex-wrap items-center justify-between gap-3 shadow-lg z-50 relative">
    <div class="flex items-center gap-2.5">
      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-secondary/15 text-secondary border border-secondary/30 text-[10px] font-bold uppercase tracking-wider status-glow-success">
        <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-ping"></span>
        Stitch System Active
      </span>
      <span class="text-slate-300 hidden sm:inline">Stitch MCP Project: <strong class="text-white font-mono">7269909586657254790</strong></span>
    </div>
    <div class="flex items-center gap-2">
      <a href="stitch-ops.html" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold shadow-md shadow-brand-600/30 transition active:scale-95">
        <span class="material-symbols-outlined text-sm" style="font-size:16px;">dashboard_customize</span>
        <span>Open Stitch Ops Command</span>
      </a>
      <a href="backend-demo.html" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-slate-300 hover:text-white font-medium border border-outline-variant/30 transition">
        <span class="material-symbols-outlined text-sm" style="font-size:16px;">terminal</span>
        <span class="hidden md:inline">API Console</span>
      </a>
    </div>
  </div>

  <div id="root"></div>

  <!-- API Client Utility -->
  <script src="api.js"></script>

  <!-- Main Application Script (Pre-compiled with classic runtime for full UMD browser support) -->
  <script src="app.compiled.js?v=2"></script>
</body>
</html>
